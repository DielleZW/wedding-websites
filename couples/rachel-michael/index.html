<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the date for Rachel and Michael’s wedding on Saturday, 25 September 2027 in Harare, Zimbabwe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eeece8">
  <title>Rachel &amp; Michael | Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Mrs+Saint+Delafield&display=swap">
  <link rel="stylesheet" href="styles.css?v=signature">
</head>
<body>
  <main>
    <section class="announcement" aria-labelledby="couple">
      <img class="portrait" src="assets/beach.jpg" width="912" height="1600" alt="Rachel and Michael smiling together on the beach" fetchpriority="high">
      <div class="announcement-copy">
        <p class="announcement-title">
          <span class="script save">save</span>
          <span class="the">the</span>
          <span class="script date-word">date</span>
        </p>
        <div class="details">
          <h1 id="couple">Rachel + Michael</h1>
          <p><time datetime="2027-09-25" aria-label="25 September 2027">25.09.2027</time></p>
          <p>Harare, Zimbabwe</p>
          <p class="note">Formal invitation to follow</p>
        </div>
      </div>
    </section>
    <figure class="second-photo">
      <img src="assets/fishing.jpg" width="1365" height="1537" alt="Rachel and Michael fishing together by the water" loading="lazy">
    </figure>
  </main>
</body>
</html>
