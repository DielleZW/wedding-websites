<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#282c21"><meta name="description" content="Siphiwe & Melusi invite you to save the date — 18 April 2027, Victoria Falls, Zimbabwe."><title>Siphiwe & Melusi — Save the Date</title><link rel="stylesheet" href="style.css"></head><body>
<main class="experience" id="experience">
<section class="scene" aria-label="Siphiwe and Melusi's enchanted garden invitation">
<div class="open-scene" aria-hidden="true"></div>
<div class="closed-gate" id="closedGate" aria-hidden="true"><div class="gate-half gate-left"></div><div class="gate-half gate-right"></div></div>
<div class="sunbeam" aria-hidden="true"></div><div class="particles" id="particles" aria-hidden="true"></div>
<div class="entrance-controls" id="entranceControls"><button class="open-button" id="openButton" aria-label="Open the garden gates"><span>Tap to open the gates</span><span class="down-arrow">⌄</span></button></div>
<div class="top-controls"><button class="round-control" id="soundButton" aria-label="Toggle garden sounds" aria-pressed="false">♫<span class="sr-only"> Toggle sounds</span></button><button class="round-control" id="menuButton" aria-label="Open invitation menu" aria-expanded="false">☰</button></div>
<div class="final-controls" id="finalControls"><div class="actions"><button data-action="calendar" aria-label="Add to calendar"><span>▦</span><small>Add to<br>calendar</small></button><button data-action="location" aria-label="Location details"><span>♧</span><small>Location<br>details</small></button><button data-action="updates" aria-label="Stay informed"><span>✉</span><small>Stay<br>informed</small></button><button data-action="story" aria-label="Our story"><span>♡</span><small>Our<br>story</small></button></div></div>
<div class="hint" id="hint" aria-live="polite"></div>
</section></main>
<div class="modal-backdrop" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="closeModal" aria-label="Close">×</button><div class="modal-flourish">✦ ❀ ✦</div><h2 id="modalTitle"></h2><div id="modalBody"></div></section></div>
<script src="script.js" defer></script></body></html>
