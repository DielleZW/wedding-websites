<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the date for Rachel and Michael’s wedding on Saturday, 25 September 2027 in Harare, Zimbabwe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Rachel &amp; Michael | Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="styles.css?v=stationery">
</head>
<body>
  <main>
    <section class="announcement" aria-labelledby="couple">
      <p class="announcement-title" aria-label="Save our date">
        <span aria-hidden="true">Save</span>
        <span class="our" aria-hidden="true">our</span>
        <span aria-hidden="true">Date</span>
      </p>
      <h1 id="couple">Rachel <span aria-label="and">+</span> Michael</h1>
      <p class="getting-married">are getting married</p>
      <div class="wedding-details">
        <p><time datetime="2027-09-25">25 September 2027</time></p>
        <p>Harare, Zimbabwe</p>
      </div>
      <p class="date-numerals" aria-hidden="true">25 / 09 / 2027</p>
      <p class="note">Formal invitation<br>to follow</p>
    </section>
    <div class="photos">
      <img src="assets/beach.jpg" width="912" height="1600" alt="Rachel and Michael smiling together on the beach" loading="lazy">
      <img src="assets/fishing.jpg" width="1365" height="1537" alt="Rachel and Michael fishing together by the water" loading="lazy">
    </div>
  </main>
</body>
</html>
