<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the date for Rachel and Michael’s wedding on Saturday, 25 September 2027 in Harare, Zimbabwe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f3ed">
  <title>Rachel &amp; Michael | Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="styles.css?v=cursive">
</head>
<body>
  <main>
    <section class="announcement" aria-labelledby="couple">
      <div class="details">
        <p class="eyebrow">Save the date</p>
        <h1 id="couple"><span>Rachel</span> <span class="ampersand">&amp;</span> <span>Michael</span></h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="date"><time datetime="2027-09-25">Saturday, 25 September 2027</time></p>
        <p class="location">Harare, Zimbabwe</p>
        <p class="note">Formal invitation to follow</p>
      </div>
      <img class="portrait" src="assets/beach.jpg" width="912" height="1600" alt="Rachel and Michael smiling together on the beach" fetchpriority="high">
    </section>
    <figure class="lakeside">
      <img src="assets/fishing.jpg" width="1365" height="1537" alt="Rachel and Michael fishing together by the water" loading="lazy">
    </figure>
  </main>
</body>
</html>
