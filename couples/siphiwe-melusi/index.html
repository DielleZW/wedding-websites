<body>
  <div class="topline"></div>
  <nav class="nav" aria-label="Wedding navigation">
    <div class="nav-inner">
      <a class="brand" href="#home" id="brand">Our Wedding</a>
      <div class="links" id="links"></div>
    </div>
  </nav>
  <main id="app"></main>
  <footer>
    <strong id="footer-names"></strong>
    <div>Made with love</div>
    <div class="pmw-credit"><span>Wedding website by</span> <a href="https://planmywedding.com/" target="_blank" rel="noopener noreferrer">Plan My Wedding Africa ↗</a></div>
  </footer>
  <script src="script.js?v=1"></script>
  <script>
    // This couple's invitation artwork already contains the hero wording.
    (() => {
      const wedding = window.PMW_WEDDING;
      const hero = document.getElementById("home");
      if (!hero || !wedding) return;

      const artwork = document.createElement("img");
      artwork.className = "hero-artwork";
      artwork.src = wedding.heroImage;
      artwork.alt = wedding.names + " — " + wedding.date + " · " + wedding.destination;
      artwork.fetchPriority = "high";
      hero.replaceChildren(artwork);
      hero.style.removeProperty("background-image");
      hero.setAttribute("aria-label", wedding.names + " wedding invitation");

      if (wedding.rsvp?.enabled && wedding.rsvp.googleFormUrl) {
        const url = new URL(wedding.rsvp.googleFormUrl, location.href);
        if (url.protocol !== "https:") return;
        const button = document.createElement("a");
        button.className = "button hero-rsvp";
        button.href = url.href;
        button.target = "_blank";
        button.rel = "noopener noreferrer";
        button.textContent = "RSVP";
        button.setAttribute("aria-label", "RSVP via Google Forms (opens in a new tab)");
        hero.append(button);
      }
    })();
  </script>
</body>
