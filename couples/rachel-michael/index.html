<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the date for Rachel and Michael’s wedding on Saturday, 25 September 2027 in Harare, Zimbabwe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171717">
  <title>Rachel &amp; Michael | Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Mrs+Saint+Delafield&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="styles.css?v=portrait-fit">
</head>
<body>
  <main>
    <section class="announcement" aria-labelledby="couple">
      <img class="portrait" src="assets/beach.jpg" width="912" height="1600" alt="Rachel and Michael smiling together on the beach" fetchpriority="high">
      <p class="announcement-title">
        <span class="visually-hidden">Save our date</span>
        <span class="arc" aria-hidden="true"><span style="--x:-4.47em;--y:0.95em;--angle:-24deg">S</span><span style="--x:-3.76em;--y:0.66em;--angle:-20deg">A</span><span style="--x:-3.03em;--y:0.43em;--angle:-16deg">V</span><span style="--x:-2.29em;--y:0.24em;--angle:-12deg">E</span><span style="--x:-0.77em;--y:0.03em;--angle:-4deg">O</span><span style="--x:0.00em;--y:0.00em;--angle:0deg">U</span><span style="--x:0.77em;--y:0.03em;--angle:4deg">R</span><span style="--x:2.29em;--y:0.24em;--angle:12deg">D</span><span style="--x:3.03em;--y:0.43em;--angle:16deg">A</span><span style="--x:3.76em;--y:0.66em;--angle:20deg">T</span><span style="--x:4.47em;--y:0.95em;--angle:24deg">E</span></span>
      </p>
      <div class="details">
        <h1 id="couple">Rachel <span>+</span> Michael</h1>
        <p class="date"><time datetime="2027-09-25" aria-label="25 September 2027">25.09.2027</time></p>
        <p class="location">Harare, Zimbabwe</p>
        <p class="note">Formal invitation to follow</p>
      </div>
    </section>
    <figure class="second-photo">
      <img src="assets/fishing.jpg" width="1365" height="1537" alt="Rachel and Michael fishing together by the water" loading="lazy">
    </figure>
  </main>
</body>
</html>
